const mkP = (ch, tm) => ({

      g = AC.createGain();

    o.frequency.value = f;
    g.gain.value = v;
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);

    g.connect(AC.destination);

function txt(s, x, y, c = "#fff") {

}
function menu() {

  ov.style.display = "flex";

    (b) => (b.onclick = () => start(+b.dataset.i)),

}
function start(i) {
  let j;
  do j = (Math.random() * RS.length) | 0;
  while (j === i);
  me = mkP(RS[i], 0);
  cpu = mkP(RS[j], 1);
  sc = [0, 0];
  clock = 120;
  sd = 0;
  fin = 0;
  rs = 0;

    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    st: "held",
    owner: null,
    sc: 0,
    sh: 0,
    last: null,
    age: 0,
    lt: 0,
    a: 0,
    three: 0,
  };
  setup(0);
  S = "play";
  ov.style.display = "none";
  snd(500, 0.2, "square");
}
function setup(t) {
  const a = t ? cpu : me,
    b = t ? me : cpu;
  for (const p of [a, b]) {
    p.h = p.vh = p.vx = p.cx = p.rch = 0;
    p.st = "i";
    p.ai = {};
  }
  a.x = ARC - 70;
  b.x = ARC + 8;
  B.st = "held";
  B.owner = a;
  B.sc = 0;
  B.sh = 0;
  B.lt = t;
  cl = 1;
  B.vx = B.vy = 0;
}
function end() {
  S = "over";
  ov.style.display = "flex";
  const w = sc[0] > sc[1];
  ov.innerHTML = `<h1>${w ? "YOU WIN!" : "FINAL — YOU LOSE"}</h1><p style="font-size:22px">${me.ch.n} ${sc[0]} — ${sc[1]} ${cpu.ch.n}</p><button class="big" id="pa">Pick a player</button>`;
  $("#pa").onclick = menu;
  snd(w ? 800 : 200, 0.5, "triangle");
}
function ik(sx, sy, tx, ty, a, b, bd) {
  const dx = tx - sx,
    dy = ty - sy,
    d = Math.min(Math.hypot(dx, dy), a + b - 0.5) || 1,
    an = Math.atan2(dy, dx),
    g = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  return [
    sx + a * Math.cos(an + bd * g),
    sy + a * Math.sin(an + bd * g),
    sx + d * Math.cos(an),
    sy + d * Math.sin(an),
  ];
}
function lm(sx, sy, tx, ty, bd, w, col, bk) {
  const r = ik(sx, sy, tx, ty, 27, 27, bd);
  X.lineWidth = w;
  X.strokeStyle = col;
  X.beginPath();
  X.moveTo(sx, sy);
  X.lineTo(r[0], r[1]);
  X.lineTo(r[2], r[3]);
  X.stroke();
  if (bk) {
    X.strokeStyle = "rgba(0,0,0,.3)";
    X.stroke();
  }
  return [r[2], r[3]];
}
function pose(p) {
  const c = p.ch,
    t = p.t,
    air = p.h > 3,
    has = B.owner === p && B.st === "held";
  let cr = 0,
    tl = 0,
    hF,
    hB,
    bl = null,
    fF,
    fB;
  if (p.st === "s") {
    const k = Math.min(1, t / c.dur),
      e = Math.min(1, k / 0.62),
      s = e * e * (3 - 2 * e),
      a = [16, -30],
      b = [8 + c.ry * 0.25, -38 - c.ry * 0.8];
    if (k < 0.62) {
      hF = [a[0] + (b[0] - a[0]) * s, a[1] + (b[1] - a[1]) * s];
      hB = [hF[0] - 5, hF[1] + 9];
      bl = [hF[0] + 3, hF[1] - 9];
    } else {
      const f = (k - 0.62) / 0.38;
      hF = [b[0] + 9 * f, b[1] + 16 * f];
      hB = [hF[0] - 16, hF[1] + 24];
    }
    tl = -c.fade * 0.55 * Math.sin(k * Math.PI);
    cr = p.h <= 0 && k < 0.3 ? 10 * (1 - k / 0.3) : 0;
  } else if (p.st === "b") {
    const w = Math.sin(p.t * 22);
    hF = [16, -14];
    hB = [-6, -18];
    bl = [16 + w * 8, 34 - Math.abs(w) * 40];
    tl = -0.3;
    cr = 8;
  } else if (p.st === "c") {
    hF = [16, -28];
    hB = [10, -24];
    bl = [20, -37];
    cr = 9;
  } else if (has) {
    const d =
        p.cx > 0 ? Math.abs(Math.sin(T * 18)) : Math.abs(Math.sin(T * 7.5)),
      by = 38 - d * 52;
    bl = [p.cx > 0 ? Math.sin(T * 18) * 22 : 24, by];
    hF = [bl[0], clamp(by - 10, -14, 12)];
    hB = [-8, -18];
    cr = 4;
  } else if (air) {
    hF = [16, -98];
    hB = [6, -102];
  } else if (p.rch > 0) {
    hF = [44, -30];
    hB = [34, -34];
  } else {
    const s = Math.sin(p.ph);
    hF = [s * 16, -20];
    hB = [-s * 16, -20];
  }
  const gy = 52 - cr,
    s = Math.sin(p.ph),
    m = Math.abs(p.vx) > 25 && !air;
  if (air) {
    fF = [14, 42];
    fB = [-8, 36];
  } else if (m) {
    fF = [s * 22, gy - Math.max(0, Math.cos(p.ph)) * 12];
    fB = [-s * 22, gy - Math.max(0, -Math.cos(p.ph)) * 12];
  } else {
    fF = [12, gy];
    fB = [-12, gy];
  }
  const q = { hx: p.x, hy: FL - 52 - p.h + cr, tl, hF, hB, fF, fB, bl };
  if (bl) {
    const w = wp(q, p, bl);
    q.bx = w[0];
    q.by = w[1];
  }
  return q;
}
function wp(q, p, l) {
  const cs = Math.cos(q.tl),
    sn = Math.sin(q.tl);
  return [q.hx + p.f * (l[0] * cs - l[1] * sn), q.hy + l[0] * sn + l[1] * cs];
}
function drawP(p) {
  const q = pose(p),
    c = p.ch;
  X.fillStyle = "rgba(0,0,0,.3)";
  X.beginPath();
  X.ellipse(p.x, FL + 6, 28 - Math.min(12, p.h * 0.08), 7, 0, 0, 6.3);
  X.fill();
  X.save();
  X.translate(q.hx, q.hy);
  X.scale(p.f, 1);
  X.rotate(q.tl);
  X.lineCap = "round";
  X.lineJoin = "round";
  const sh = [2, -37],
    shoe = (f) => {
      X.fillStyle = "#f5f5f5";
      X.beginPath();
      X.ellipse(f[0] + 5, f[1] + 2, 9, 4.5, 0, 0, 6.3);
      X.fill();
    };

  X.strokeStyle = c.col;
  X.lineWidth = 22;
  X.beginPath();
  X.moveTo(0, -5);
  X.lineTo(1, -35);
  X.stroke();
  X.lineWidth = 21;
  X.beginPath();
  X.moveTo(0, -1);
  X.lineTo(0, 11);
  X.stroke();
  X.strokeStyle = "rgba(0,0,0,.3)";
  X.stroke();
  X.fillStyle = c.sk;
  X.beginPath();
  X.arc(5, -52, 9.5, 0, 6.3);
  X.fill();
  X.fillStyle = "#1a1a1a";
  X.beginPath();
  X.arc(4, -53, 10, 3.3, 6.1);
  X.fill();
  shoe(lm(0, 0, q.fF[0], q.fF[1], -1, 9, c.sk, 0));
  lm(sh[0], sh[1], q.hF[0], q.hF[1], 1, 8, c.sk, 0);
  X.restore();
  X.fillStyle = "#fff";
  X.font = "700 11px system-ui";
  X.textAlign = "center";
  X.fillText(
    (p === me ? "▼ " : "") + c.n.split(" ").pop().toUpperCase(),
    p.x,
    q.hy - 80 - Math.max(0, p.h * 0.1),
  );
  if (p === me && p.st === "c") {
    const w = 70,
      m = (c.rel + 0.07) / 0.97,
      x0 = p.x - w / 2,
      y0 = q.hy - 100;
    X.fillStyle = "rgba(0,0,0,.6)";
    X.fillRect(x0 - 2, y0 - 2, w + 4, 9);
    X.fillStyle = "#2ecc71";
    X.fillRect(x0 + ((c.rel - 0.07) / m) * w, y0, (0.14 / m) * w, 5);
    X.fillStyle = "#ffd23f";
    X.fillRect(x0 + Math.min(1, p.t / m) * w - 1, y0 - 3, 3, 11);
  }
}
function launch(p) {
  p.rl = 1;
  const c = p.ch,
    o = p === me ? cpu : me,
    q = pose(p),
    rp = wp(q, p, [8 + c.ry * 0.25 + 3, -38 - c.ry * 0.8 - 9]),
    x0 = rp[0],
    y0 = rp[1],
    dist = HX - x0,
    ft = dist / 10.5;
  let b =
      ft < 8
        ? (c.ins / 100) * 0.8
        : p.x > ARC
          ? (c.mid / 100) * 0.6
          : (c.t3 / 100) * 0.5,
    err = Math.abs(p.mt - c.rel),
    gr = err <= 0.07;
  b += gr ? 0.18 : -Math.min(0.35, (err - 0.07) * 1.6) * (ft < 8 ? 0.4 : 1);
  const d = Math.abs(o.x - p.x),
    fr = o.x > p.x - 25,
    ct = (fr ? Math.max(0, 1 - d / 85) : 0) * (p.sbw > 0 ? 0.3 : 1);
  b -= o.h > 20 && fr ? Math.min(1, ct * 1.4 + 0.15) * 0.35 : ct * 0.22;
  B.st = "free";
  B.sh = 1;
  B.sc = 0;
  B.last = p;
  B.age = 0;
  B.owner = null;
  B.three = p.x <= ARC;
  if (
    o.h > 22 &&
    d < 64 &&
    fr &&
    Math.random() < 0.1 + ct * 0.35 * (o.ch.def / 100)
  ) {
    B.x = x0;
    B.y = y0;
    B.vx = -120 - Math.random() * 160;
    B.vy = -120;
    txt("BLOCKED!", o.x, FL - 170, "#ff6b4a");
    snd(150, 0.15, "square");
    return;
  }
  const mk = Math.random() < clamp(b, 0.03, 0.97),
    tx =
      HX +
      (mk
        ? (Math.random() - 0.5) * 6
        : (Math.random() < 0.5 ? -1 : 1) * (14 + Math.random() * 16));
  if (gr && p === me) txt("GREEN!", p.x, FL - 170, "#2ecc71");
  const h = Math.max(60 + (c.arc - 60) * Math.min(1, dist / 450), y0 - HY + 45),
    vy = -Math.sqrt(2 * G * h),
    t = (-vy + Math.sqrt(vy * vy + 2 * G * (HY - y0))) / G;
  B.x = x0;
  B.y = y0;
  B.vy = vy;
  B.vx = (tx - x0) / t;
  snd(380, 0.07, "triangle");
}
function score() {
  const t = B.last.tm,
    pts = B.three ? 3 : 2;
  sc[t] += pts;
  txt(
    "+" + pts + (B.three ? " THREE!" : ""),
    HX - 70,
    HY - 90,
    B.three ? "#ffd23f" : "#fff",
  );
  netT = 0.5;
  snd(900, 0.25, "sine", 0.1);
  B.sh = 0;
  rs = 1.3;
  pend = 1 - t;
  fin = clock <= 0 || sd ? 1 : 0;
}
function stepBall(dt) {
  if (B.st === "held") return;
  B.age += dt;
  B.vy += G * dt;
  const py = B.y;
  B.x += B.vx * dt;
  B.y += B.vy * dt;
  B.a += B.vx * dt * 0.05;
  for (const rx of [RF, RB]) {
    const dx = B.x - rx,
      dy = B.y - HY,
      d = Math.hypot(dx, dy),
      m = BR + 3;
    if (d < m && d > 0) {
      const nx = dx / d,
        ny = dy / d;
      B.x = rx + nx * m;
      B.y = HY + ny * m;
      const dot = B.vx * nx + B.vy * ny;
      if (dot < 0) {
        B.vx -= 1.55 * dot * nx;
        B.vy -= 1.55 * dot * ny;
        B.vx *= 0.85;
        snd(300, 0.06, "triangle");
      }
    }
  }
  if (B.x > BB - BR && B.y > HY - 105 && B.y < HY + 6) {
    B.x = BB - BR;
    B.vx = -Math.abs(B.vx) * 0.6;
    snd(200, 0.05, "square");
  }
  if (
    py < HY &&
    B.y >= HY &&
    B.vy > 0 &&
    B.x > RF + 3 &&
    B.x < RB - 3 &&
    !B.sc
  ) {
    B.sc = 1;
    score();
  }
  if (B.y > FL - BR) {
