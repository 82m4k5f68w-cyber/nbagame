<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hoops 2K27</title><style>
:root{--bg:#06070e;--fg:#f4f6ff;--mut:#9aa3c7;--gold:#ffd23f;--org:#ff6a1f;--cy:#4fd1ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06070e;--fg:#f4f6ff}}:root[data-theme="dark"]{--bg:#06070e;--fg:#f4f6ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:14px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0 18px}
.brand{font-weight:900;letter-spacing:4px;font-size:22px}.brand b{color:var(--gold);margin-left:8px;text-shadow:0 0 18px #ffd23f88}
nav{display:flex;gap:6px;background:#ffffff0d;border:1px solid #ffffff18;border-radius:999px;padding:4px;backdrop-filter:blur(10px)}
nav button{position:relative;border:0;background:none;color:var(--mut);font:700 13px system-ui;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.2s}
nav button.on{background:linear-gradient(90deg,var(--org),var(--gold));color:#111}nav button:not(.on):hover{color:#fff}
nav i{position:absolute;top:-6px;right:-4px;background:#ff3b5c;color:#fff;font:800 9px system-ui;padding:2px 6px;border-radius:999px;font-style:normal;animation:pu 1.2s infinite}
@keyframes pu{50%{transform:scale(1.15)}}
.hero{text-align:center;padding:18px 0 26px}.ball{font-size:54px;display:inline-block;animation:bn .8s cubic-bezier(.3,.6,.5,1) infinite alternate}
@keyframes bn{from{transform:translateY(10px)}to{transform:translateY(-16px) rotate(200deg)}}
.logo{font-size:clamp(44px,12vw,104px);font-weight:900;letter-spacing:6px;line-height:1;background:linear-gradient(100deg,#fff 20%,var(--gold) 45%,var(--org) 60%,#fff 85%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.sub{margin-top:8px;font-size:12px;letter-spacing:5px;color:var(--mut)}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.stats span{background:#ffffff0d;border:1px solid #ffffff18;border-radius:999px;padding:7px 14px;font:700 12px system-ui;color:#dfe5ff}.stats b{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;perspective:1000px}
.m{position:relative;border-radius:22px;padding:20px 18px 16px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 85%,#000),#0d1020 78%);border:1px solid #ffffff22;overflow:hidden;opacity:0;animation:in .6s forwards;animation-delay:calc(var(--i)*90ms);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s,box-shadow .3s}
.m:hover{box-shadow:0 18px 50px color-mix(in srgb,var(--c) 55%,transparent)}.m::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),#ffffff26,transparent 55%);pointer-events:none}
@keyframes in{from{opacity:0;transform:translateY(26px) scale(.95)}to{opacity:1}}
.m.big{grid-column:1/-1}.ic{font-size:34px}.m h2{margin:6px 0 4px;font-size:23px;letter-spacing:2px}.m p{margin:0 0 14px;font-size:13px;line-height:1.45;color:#dfe5ffcc;min-height:38px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tags i{font-style:normal;font:800 10px system-ui;letter-spacing:1px;background:#00000055;border:1px solid #ffffff24;padding:3px 8px;border-radius:999px}.tags i.hot{background:var(--gold);color:#111;border-color:var(--gold)}
.m button{margin:3px 6px 3px 0;border:0;border-radius:12px;padding:12px 18px;font:900 14px system-ui;letter-spacing:1px;cursor:pointer;color:#111;background:linear-gradient(90deg,var(--org),var(--gold));transition:transform .15s,filter .15s}
.m button.b2{background:#ffffffee}.m button:hover{transform:translateY(-2px) scale(1.04);filter:brightness(1.1)}
section[hidden]{display:none}.panel{background:#ffffff08;border:1px solid #ffffff18;border-radius:20px;padding:6px 18px;backdrop-filter:blur(10px)}
.rel{padding:16px 0;border-bottom:1px solid #ffffff14;animation:in .5s both}.rel:last-child{border:0}.rel h3{margin:0 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:18px}.rel h3 em{font:800 11px system-ui;font-style:normal;background:linear-gradient(90deg,var(--org),var(--gold));color:#111;padding:3px 9px;border-radius:999px}.rel h3 s{text-decoration:none;font:600 12px system-ui;color:var(--mut);margin-left:auto}
.rel ul{margin:6px 0 0;padding-left:18px;color:#dfe5ffcc;font-size:13px;line-height:1.6}.rel li b{color:#fff}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 26px;padding:10px 0}.keys div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff10;font-size:13px;color:#dfe5ffcc}.keys kbd{background:#ffffff14;border:1px solid #ffffff26;border-radius:7px;padding:2px 8px;font:700 12px ui-monospace,monospace;color:#fff;white-space:nowrap}
.foot{margin-top:26px;text-align:center;font-size:11px;color:var(--mut)}h4{margin:16px 0 4px;color:var(--gold);letter-spacing:2px;font-size:12px}
</style></head><body><canvas id="bg"></canvas><div class="wrap">
<header><div class="brand">HOOPS<b>2K27</b></div><nav><button data-t="play" class="on">Play</button><button data-t="log">Update Log<i id="nw">NEW</i></button><button data-t="how">Controls</button></nav></header>
<section id="play"><div class="hero"><div class="ball">🏀</div><div class="logo">HOOPS 2K27</div><div class="sub">NEXT-LEVEL BASKETBALL · v2.5</div><div class="stats"><span><b>7</b> teams</span><span><b>35</b> players</span><span><b>5</b> modes</span><span><b>3D</b> WebGL + physics</span><span><b>2</b> players local</span></div></div><div class="grid" id="grid"></div></section>

<div class="foot">Unofficial fan project · rosters, ratings and shot styles are approximate · tap “← Modes” in a game to return</div></div>
<script>(function(){const G=__G__;
const MODES=[

{v:'2.0',n:'Gameplay',d:'Oct 2026',l:['Local 2-player','No steals; physics net; crossover flick','Cuts and relocations for every off-ball player; Curry runs the most','Passing overhaul, rebound assist, wider greens, meter green at the top']},

const K1=[['Move','WASD / arrows'],['Shoot','hold SPACE, release on green'],['Tempo mode','T, then tap SPACE twice'],['Sprint','Shift'],['Pass','E (toward your stick)'],['Lob pass','R'],['Meter style','M'],['Camera','K'],['Switch defender','Q']];

const $=s=>document.querySelector(s);
window.go=function(k,my,mp){window.__MY=my?1:0;window.__MP=mp?1:0;document.open();document.write(G[k]);document.close()};
$('#grid').innerHTML=MODES.map((m,i)=>`<div class="m${m.big?' big':''}" style="--c:${m.c};--i:${i}"><div class="ic">${m.ic}</div><h2>${m.t}</h2><div class="tags">${m.hot?`<i class="hot">${m.hot}</i>`:''}${m.tags.map(t=>`<i>${t}</i>`).join('')}</div><p>${m.d}</p>${m.b.map(b=>`<button class="${b[4]?'b2':''}" data-g="${b[1]}" data-my="${b[2]||0}" data-mp="${b[3]||0}">${b[0]}</button>`).join('')}</div>`).join('');
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>window.go(b.dataset.g,+b.dataset.my,+b.dataset.mp));
document.querySelectorAll('.m').forEach(c=>{c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--ry',((x-.5)*8)+'deg');c.style.setProperty('--rx',((.5-y)*6)+'deg');c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%')};c.onmouseleave=()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
$('#logp').innerHTML=LOG.map((r,i)=>`<div class="rel" style="animation-delay:${i*60}ms"><h3>v${r.v} <span>${r.n}</span>${r.n2?'<em>LATEST</em>':''}<s>${r.d}</s></h3><ul>${r.l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
const kh=(id,a)=>$(id).innerHTML=a.map(x=>`<div><span>${x[0]}</span><kbd>${x[1]}</kbd></div>`).join('');kh('#k1',K1);kh('#k2',K2);kh('#k3',K3);kh('#k4',K4);kh('#k5',K5);
try{if(localStorage.getItem('h2k_seen')==='2.5')$('#nw').style.display='none'}catch(e){}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));['play','log','how'].forEach(t=>$('#'+t).hidden=t!==b.dataset.t);if(b.dataset.t==='log'){$('#nw').style.display='none';try{localStorage.setItem('h2k_seen','2.5')}catch(e){}}window.scrollTo(0,0)});
const cv=$('#bg'),c=cv.getContext('2d');let W,H,pts=[];function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;pts=Array.from({length:42},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3,v:.15+Math.random()*.5}))}rs();addEventListener('resize',rs);let t0=0;

 c.strokeStyle='rgba(255,170,80,.10)';c.lineWidth=1;const hz=H*.62,off=(t*.02)%80;for(let i=-12;i<=12;i++){c.beginPath();c.moveTo(W/2+i*40,hz);c.lineTo(W/2+i*260,H);c.stroke()}for(let k=0;k<12;k++){const y=hz+Math.pow((k*80+off)/960,2)*(H-hz)*2.2;if(y>hz&&y<H){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}}
 c.beginPath();c.arc(W/2,hz+8,Math.min(W,H)*.2,Math.PI,0);c.strokeStyle='rgba(255,210,63,.12)';c.lineWidth=2;c.stroke();
 for(const p of pts){p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}c.fillStyle='rgba(255,140,50,.35)';c.beginPath();c.arc(p.x,p.y,p.r,0,6.3);c.fill()}requestAnimationFrame(fr)}requestAnimationFrame(fr);
})();</script></body></html>
