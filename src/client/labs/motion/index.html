<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hoops 2K27 Motion Studio</title>
<style>
:root{color-scheme:dark;--bg:#06070e;--fg:#e9eefc;--mut:#8f9bbf;--acc:#ffd23f;--line:#2f3866}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;padding:0 16px 24px}
h1{font-size:18px;color:var(--acc);margin:12px 0 4px}
p{color:var(--mut);margin:0 0 10px;max-width:760px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.stage{position:relative;width:min(480px,100%);aspect-ratio:1;background:#000;border-radius:8px;overflow:hidden}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#plot{width:min(480px,100%);aspect-ratio:1;background:#0d1124;border-radius:8px}
button{background:#1b2140;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;min-height:40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
pre{color:var(--mut);white-space:pre-wrap;font:12px ui-monospace,monospace}
</style>
</head>
<body>
<h1>Motion Studio</h1>
<p>Film one move with your whole body in frame (feet included, side or 3/4 view). Pose landmarks become our skeleton's joint curves live; record, then export the JSON and turn it into a BVH with <code>scripts/assets/video2bvh.py</code>. Everything runs on this device.</p>
<div class="bar"><button id="cam">Use webcam</button><button id="sample">Use sample clip</button><button id="rec">Record</button><button id="save" disabled>Export JSON</button></div>
<div class="row"><div class="stage"><video id="v" playsinline muted></video><canvas id="ov" width="480" height="480"></canvas></div><canvas id="plot" width="480" height="480"></canvas></div>
<pre id="out">loading the pose model…</pre>
<script type="module" src="./main.ts"></script>
</body>
</html>
