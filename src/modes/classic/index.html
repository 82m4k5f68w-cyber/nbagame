<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hoops 2K27</title>
<style>
:root{--bg:#f4f1ea;--fg:#14141a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f14;--fg:#eee}}
:root[data-theme="dark"]{--bg:#0e0f14;--fg:#eee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{position:relative;max-width:960px;margin:0 auto}
canvas{display:block;width:100%;height:auto;background:#000;touch-action:none}
#ov{position:absolute;inset:0;background:rgba(8,10,22,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;overflow:auto}
#ov h1{margin:0;font-size:clamp(28px,6vw,54px);letter-spacing:3px;color:#ffd23f}
#ov p{margin:6px 0 12px;opacity:.8;font-size:14px}
#g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%;max-width:900px}
#g button,.big{background:#1c2140;color:#fff;border:1px solid #3a4280;border-radius:10px;padding:8px;cursor:pointer;font:inherit}
#g button:hover,.big:hover{background:#e8541e;border-color:#ffd23f}
#g b{display:block;font-size:13px}#g small{display:block;opacity:.7;font-size:11px;margin:2px 0}#g span{font-size:10px;opacity:.9}
.big{font-size:18px;padding:10px 26px;margin-top:12px}
#tc{display:none;justify-content:space-between;gap:6px;padding:8px}
#tc button{flex:1;height:54px;border-radius:12px;border:0;background:#2a2f55;color:#fff;font-weight:700;font-size:13px}
@media (pointer:coarse){#tc{display:flex}}
.note{font-size:12px;opacity:.65;padding:8px 12px;text-align:center}
</style></head><body><button id="bk" style="position:fixed;left:6px;top:6px;z-index:99;background:#000a;color:#fff;border:1px solid #fff4;border-radius:8px;padding:6px 10px;font:700 12px system-ui">← Modes</button><script>document.getElementById("bk").onclick=function(){location.reload()}</script>
<div id="app"><canvas id="c" width="960" height="540"></canvas><div id="ov"></div></div>
<div id="tc"><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button><button data-k="Space">SHOOT / JUMP</button><button data-k="KeyE">STEAL / CROSSOVER</button><button data-k="KeyF">STEP-BACK</button></div>
<div class="note">A/D or ←/→ move · hold SPACE, release on the green zone to shoot (on defense: jump/block) · E = crossover / steal · F = step-back (Curry: double step-back). Unofficial fan project; ratings & shot styles are stylized approximations.</div>
<script src="game.js"></script></body></html>
