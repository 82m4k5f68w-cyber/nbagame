<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hoops 2K27</title>
<!-- Unity WebGL template (Editor/Build.cs: PlayerSettings.WebGL.template = "PROJECT:Hoops"). The HTML game's hub, matchup
     screen, settings drawer, pause and final screens (TemplateData/ui.js) drawn over the Unity canvas, which renders the
     game + in-game HUD. hub.css / game.css / roster.js / hubdata.js are generated by scripts/unity/gen-page.ts. -->
<link rel="stylesheet" id="hcss" href="TemplateData/hub.css">
<link rel="stylesheet" id="gcss" href="TemplateData/game.css" media="not all">
<link rel="stylesheet" href="TemplateData/ui.css">
</head><body>
<canvas id="unity-canvas" tabindex="-1" aria-label="Hoops 2K27"></canvas>
<div id="hub"><canvas id="bg"></canvas><div class="wrap">
<header><div class="brand">HOOPS<b>2K27</b></div><nav><button data-t="play" class="on">Play</button><button data-t="log">Update Log<i id="nw">NEW</i></button><button data-t="how">Controls</button></nav></header>
<section id="play"><div class="hero"><div class="ball">🏀</div><div class="logo">HOOPS 2K27</div><div class="sub">NEXT-LEVEL BASKETBALL · UNITY EDITION</div><div class="stats" id="hst"></div></div><div class="grid" id="grid"></div></section>
<section id="log" hidden><div class="panel" id="logp"></div></section>
<section id="how" hidden><div class="panel"><h4>MOVE &amp; SHOOT</h4><div class="keys" id="k1"></div><h4>DRIBBLE &amp; POST</h4><div class="keys" id="k2"></div><h4>GAME</h4><div class="keys" id="k3"></div><h4>GAMEPAD</h4><div class="keys" id="k5"></div></div></section>
<div class="foot">Unofficial fan project · rosters, ratings and shot styles are approximate · <span id="ldh">loading the arena…</span></div></div>
</div>
<div id="game" hidden><button id="bk">← Modes</button><div id="ov"></div></div>
<script src="TemplateData/roster.js"></script>
<script src="TemplateData/hubdata.js"></script>
<script src="TemplateData/ui.js"></script>
<script>
  // Unity loader: the page works (hub, menus) while the build streams in; commands wait in ui.js until Unity is ready.
  (function () {
    var cfg = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
    };
    var s = document.createElement("script");
    s.src = "Build/{{{ LOADER_FILENAME }}}";
    s.onload = function () { H2KUI.boot(document.getElementById("unity-canvas"), cfg); };
    s.onerror = function () { H2KUI.fail("Could not load the game build."); };
    document.body.appendChild(s);
  })();
</script>
</body></html>
