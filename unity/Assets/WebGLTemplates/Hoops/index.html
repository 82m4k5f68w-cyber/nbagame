<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hoops 2K27</title>
<!-- Unity WebGL template (Editor/Build.cs: PlayerSettings.WebGL.template = "PROJECT:Hoops"). The HTML game's hub, matchup
     screen, settings drawer, pause and final screens (TemplateData/ui.js) drawn over the Unity canvas, which renders the
     game + in-game HUD. hub.css / game.css / roster.js / hubdata.js are generated by scripts/unity/gen-page.ts. -->
<link rel="stylesheet" href="TemplateData/tokens.css">
<link rel="stylesheet" id="hcss" href="TemplateData/hub.css">
<link rel="stylesheet" id="gcss" href="TemplateData/game.css" media="not all">
<link rel="stylesheet" href="TemplateData/kit.css">
<link rel="stylesheet" href="TemplateData/ui.css">
</head><body>
<canvas id="unity-canvas" tabindex="-1" aria-label="Hoops 2K27"></canvas>
<div id="hub" class="kit"><canvas id="bg" aria-hidden="true"></canvas><div class="wrap">
<header class="top"><div id="brand" aria-label="Hoops 2K27"></div><nav aria-label="Sections"><button type="button" data-t="play" class="on" aria-current="page">Play</button><button type="button" data-t="log">News<i id="nw">NEW</i></button><button type="button" data-t="how">Controls</button></nav><div class="tright"><div id="prof"></div><button type="button" class="btn icon" id="hset" aria-label="Settings" title="Settings">⚙</button></div></header>
<section id="play"><div class="hero"><article id="feat"></article><aside id="side" aria-label="Quick play and record"></aside></div>
<h2 class="sec disp">Game modes</h2><div class="grid" id="grid"></div>
<h2 class="sec disp">What's new</h2><div id="news"></div></section>
<section id="log" hidden><h2 class="sec disp">Update log</h2><div class="panel log" id="logp"></div></section>
<section id="how" hidden><h2 class="sec disp">Controls</h2><div class="howg"><div class="panel"><h2 class="eyebrow">Move &amp; shoot</h2><div class="keys" id="k1"></div></div><div class="panel"><h2 class="eyebrow">Dribble &amp; post</h2><div class="keys" id="k2"></div></div><div class="panel"><h2 class="eyebrow">Game</h2><div class="keys" id="k3"></div></div><div class="panel"><h2 class="eyebrow">Gamepad</h2><div class="keys" id="k5"></div></div></div></section>
<div class="foot">Unofficial fan project · rosters, ratings and shot styles are approximate · team marks are generic · <span id="ldh">loading the arena…</span></div></div>
</div>
<div id="game" hidden><button type="button" id="bk">← Modes</button><div id="ov"></div></div>
<script src="TemplateData/roster.js"></script>
<script src="TemplateData/hubdata.js"></script>
<script src="TemplateData/ui.js"></script>
<script>
  // Unity loader: the page works (hub, menus) while the build streams in; commands wait in ui.js until Unity is ready.
  (function () {
    var cfg = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
    };
    var s = document.createElement("script");
    s.src = "Build/{{{ LOADER_FILENAME }}}";
    s.onload = function () { H2KUI.boot(document.getElementById("unity-canvas"), cfg); };
    s.onerror = function () { H2KUI.fail("Could not load the game build."); };
    document.body.appendChild(s);
  })();
</script>
</body></html>
